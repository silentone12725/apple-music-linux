name: Feature request
description: Suggest an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: confirmations
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues and this has not been requested
          required: true
