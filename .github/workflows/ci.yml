name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Go engine
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false # tests do not load the Android runtime
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - name: Install libvlc headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvlc-dev
      - run: go vet ./...
      - run: go test ./...

  electron:
    name: Electron app
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Renderer bundles are up to date
        run: |
          npm run build:engine
          git diff --exit-code -- . ':!dist'
      - run: node --test test/*.test.mjs test/engine/*.test.mjs
