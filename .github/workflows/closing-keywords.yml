name: Closing keywords

# Only the tracker may close issues, so commit messages and PR titles must not contain GitHub's closing keywords. Write
# "Refs #N" there; "Fixes #N" belongs in the PR body, where the tracker reads it. See .github/TRACKING.md.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, nightly]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check pull request commits and title
        if: github.event_name == 'pull_request'
        run: scripts/check-closing-keywords.sh --range "$BASE_SHA..$HEAD_SHA" --title "$PR_TITLE"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
      - name: Check pushed commits
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: scripts/check-closing-keywords.sh --range "$BEFORE_SHA..$AFTER_SHA"
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
